[settings]
lockfile = true

[tools]
go = "prefix:1.27"

[env]
GOBIN = "{{config_root}}/bin/tools"
_.path = ["{{config_root}}/bin/tools"]

# Task scripts are POSIX sh: mise runs them with `sh`, which is dash on Debian and Ubuntu.

[tasks.build]
description = "Build the gr binary"
run = "go build -o bin/gr ./cmd/gr"

[tasks.install]
description = "Build and install gr into PREFIX (default ~/.local)"
depends = ["build"]
# Rename from a temp file in the same directory instead of cp. cp writes into the existing inode, which
# on macOS can get later execs of a binary with a running process SIGKILLed. The rename is also atomic,
# so a TUI or agent exec during install sees the old binary or the new one, never a partial write.
run = """
set -eu
prefix="${PREFIX:-$HOME/.local}"
bindir="$prefix/bin"
mkdir -p "$bindir"
tmp="$(mktemp "$bindir/.gr.XXXXXX")"
trap 'rm -f "$tmp"' EXIT
cp bin/gr "$tmp"
chmod 755 "$tmp"
mv -f "$tmp" "$bindir/gr"
trap - EXIT
"$bindir/gr" --help >/dev/null
echo "installed $bindir/gr"
"""

[tasks.uninstall]
description = "Remove gr from PREFIX (default ~/.local)"
# Removes the binary only. The database is left alone.
run = """
set -eu
target="${PREFIX:-$HOME/.local}/bin/gr"
if [ -e "$target" ]; then
  rm -f "$target"
  echo "removed $target"
else
  echo "$target is not installed"
fi
"""

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Vet Go code"
run = "go vet ./..."

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks.test-race]
description = "Run the tests with the race detector"
run = "go test -race ./..."

[tasks.check]
description = "Format, vet, and test"
depends = ["fmt", "vet", "test"]

[tasks."demo:vhs"]
description = "Build the VHS that renders the demo, with keystroke captions"
# Upstream VHS has no keystroke captions yet: this is its main with charmbracelet/vhs#719 merged.
# The fork keeps upstream's module path, so it is built from a clone rather than go installed.
run = """
set -eu
rev=df657051dbb812369383b841dd5f3d1273b38b4a
src=bin/tools/src/vhs
if [ -x bin/tools/vhs ] && [ "$(cat bin/tools/vhs.rev 2>/dev/null)" = "$rev" ]; then
  exit 0
fi
if [ ! -d "$src" ]; then
  git clone -q https://github.com/chancez/vhs.git "$src"
fi
git -C "$src" fetch -q origin caption-overlay
git -C "$src" -c advice.detachedHead=false checkout -q "$rev"
(cd "$src" && go build -o ../../vhs .)
echo "$rev" >bin/tools/vhs.rev
"""

[tasks.demo]
description = "Render the README's demo to docs/demo.gif"
depends = ["build", "demo:vhs"]
# Needs ttyd, and ffmpeg built with libass for the captions: brew install ttyd ffmpeg-full.
run = """
set -eu
for bin in /opt/homebrew/opt/ffmpeg-full/bin /usr/local/opt/ffmpeg-full/bin; do
  if [ -d "$bin" ]; then
    PATH="$bin:$PATH"
  fi
done
GR_DEMO="$(mktemp -d)"
export GR_DEMO
trap 'rm -rf "$GR_DEMO"' EXIT
sh demo/fixture.sh "$GR_DEMO"
bin/tools/vhs demo/demo.tape
"""

[tasks.dist]
description = "Build release archives for macOS and Linux into dist/"
# gr has no cgo, so one machine builds every target. VERSION is what gr --version prints; it
# defaults to git describe. The archives' names leave it out, so releases/latest/download finds them.
run = """
set -eu
version="${VERSION:-$(git describe --tags --always --dirty)}"
rm -rf dist
mkdir -p dist
for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
  os="${target%/*}"
  arch="${target#*/}"
  name="gr_${os}_${arch}"
  mkdir -p "dist/$name"
  CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
    -ldflags "-s -w -X github.com/chancez/gr/internal/cli.version=$version" \
    -o "dist/$name/gr" ./cmd/gr
  cp README.md "dist/$name/"
  # gr at the archive's root, where mise's github backend and a manual install both find it.
  tar -C "dist/$name" -czf "dist/$name.tar.gz" gr README.md
  rm -rf "dist/$name"
done
(cd dist && shasum -a 256 ./*.tar.gz | sed 's# \\./# #' >checksums.txt)
"""
